name: UI Kit browser verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: tests
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - run: NODE_PATH=tests/node_modules node tests/test_card.cjs
      - run: NODE_PATH=tests/node_modules node tests/test_live_card.cjs
      - run: npm run test:browser
        working-directory: tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-browser-evidence
          path: test-results/

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML Jinja2
      - run: python -m unittest discover -s tests -q
      - run: python scripts/build_release.py

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-release]')
    needs: [ui, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/build_release.py
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import json,pathlib; print(json.loads(next(pathlib.Path("custom_components").glob("*/manifest.json")).read_text())["version"])')
          gh release create "v$version" --target "$GITHUB_SHA" --latest --title "hausarbeiten-manager $version" --notes-file RELEASE_NOTES.md dist/*.zip dist/SHA256SUMS.txt
